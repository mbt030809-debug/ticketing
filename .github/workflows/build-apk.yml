name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Name APK with build date (KST)
        id: apk
        run: |
          D=$(TZ=Asia/Seoul date +%Y%m%d)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/couponmacro_${D}.apk"
          echo "date=${D}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: couponmacro_${{ steps.apk.outputs.date }}
          path: out/*.apk
          if-no-files-found: error
